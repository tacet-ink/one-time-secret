  function b64ToBytes(text) {
    var bin = atob(text), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  function b64urlToBytes(text) {
    var s = text.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    return b64ToBytes(s);
  }
  function bytesToB64url(bytes) {
    var bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  // ── jr5e. 加密/解密（兩步 deriveKey；與 KAT form C 同形）──
  function aadOf(slotId) { return new TextEncoder().encode(AADP + slotId); }
  function hkdfParams(salt, slotId) { return { name: 'HKDF', hash: 'SHA-256', salt: salt, info: aadOf(slotId), length: 256 }; }
  function importEcdhPub(jwk) { return crypto.subtle.importKey('jwk', jwk, { name: 'ECDH', namedCurve: 'P-256' }, false, []); }
  function importEcdhPriv(jwk) { return crypto.subtle.importKey('jwk', jwk, { name: 'ECDH', namedCurve: 'P-256' }, false, ['deriveKey']); }
  // fill 端（B）：現生成臨時 P-256 金鑰對，封裝明文到 A.pub；eph 私鑰用完即棄、永不過線。
  async function sealToApub(aPubKey, text, slotId) {
    var keypair = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, false, ['deriveKey']);
    var ephPubRaw = new Uint8Array(await crypto.subtle.exportKey('raw', keypair.publicKey)); // 65B（0x04 未壓縮點）
    var aad = aadOf(slotId);
    var hk = await crypto.subtle.deriveKey({ name: 'ECDH', public: aPubKey }, keypair.privateKey, hkdfParams(ephPubRaw, slotId), false, ['deriveKey']);
    var aesKey = await crypto.subtle.deriveKey(hkdfParams(ephPubRaw, slotId), hk, { name: 'AES-GCM', length: 256 }, false, ['encrypt']);
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var ctTag = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv, additionalData: aad }, aesKey, new TextEncoder().encode(text)));
    var blob = new Uint8Array(65 + 12 + ctTag.length);
    blob.set(ephPubRaw, 0); blob.set(iv, 65); blob.set(ctTag, 77);
    return CIPHER + bytesToB64url(blob);
  }
  // retrieve 端（A）：以 A 私鑰解開 blob；blob 內 eph_pub 65B 解析成 JWK 再 import（WebCrypto 不收 raw ECDH 公鑰）。
  async function openBlobWithApriv(aPrivKey, cipher, slotId) {
    var raw;
    try { raw = b64urlToBytes(cipher.slice(CIPHER.length)); } catch (e) { return null; }
    if (raw.length < 65 + 12 + 16) return null;
    var eph = raw.slice(0, 65), iv = raw.slice(65, 77), ctTag = raw.slice(77);
    if (eph[0] !== 0x04) return null;
    var ephPubJwk = { kty: 'EC', crv: 'P-256', x: bytesToB64url(eph.slice(1, 33)), y: bytesToB64url(eph.slice(33, 65)) };
    var ephPubKey;
    try { ephPubKey = await importEcdhPub(ephPubJwk); } catch (e) { return null; }
    var aad = aadOf(slotId);
    try {
      var hk = await crypto.subtle.deriveKey({ name: 'ECDH', public: ephPubKey }, aPrivKey, hkdfParams(eph, slotId), false, ['deriveKey']);
      var aesKey = await crypto.subtle.deriveKey(hkdfParams(eph, slotId), hk, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv, additionalData: aad }, aesKey, ctTag);
      return new TextDecoder().decode(plain);
    } catch (e) { return null; }
  }

  function fmtTime(ms) {
    var d = new Date(ms);
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  // 複製（clipboard API 需手勢授權且可能靜默失敗，失敗時退回 execCommand）
  function copyText(text, doneBtn, copyKey) {
    function done() {
      if (doneBtn) {
        var prev = t('copy');
        doneBtn.textContent = t('copied');
        setTimeout(function () { doneBtn.textContent = t(copyKey || 'copy'); }, 2000);
      }
    }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '0';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { if (document.execCommand('copy')) done(); } catch (e) {}
      document.body.removeChild(ta);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  // ── 模式判定（fragment 鍵：#p=＝fill、#k=＝retrieve、皆無＝request；query 帶 s/t）──
  var params = new URLSearchParams(location.search);
  var slotId = (params.get('s') || '').trim();
  if (/^[0-9a-fA-F]{32}$/.test(slotId)) slotId = slotId.toLowerCase();
  var token = (params.get('t') || '').trim();
  var fragKey = '', fragVal = '';
  if (location.hash.indexOf('#p=') === 0) { fragKey = 'p'; fragVal = location.hash.slice(3); }
  else if (location.hash.indexOf('#k=') === 0) { fragKey = 'k'; fragVal = location.hash.slice(3); }
  var MODE = fragKey === 'p' ? 'fill' : fragKey === 'k' ? 'retrieve' : 'request';

  var aPubJwk = null;      // fill 端：A 公鑰 JWK（#p=）
  var aPrivKey = null;     // retrieve 端：A 私鑰 CryptoKey（#k=）
  var fillConfCode = '';   // fill 成功：確認碼（G3）
  var retWrittenAt = 0;    // retrieve 成功：填寫時間（G0）
  var retConfCode = '';    // retrieve 成功：確認碼（G3）
  var plainShown = true;   // retrieve 揭示態
  var retEye = null;

  function showErr(elId, key) {
    var el = $(elId);
    el.className = 'result err';
    el.textContent = t(key);
  }
  function showOk(elId, key) {
    var el = $(elId);
    el.className = 'result ok';
    el.textContent = t(key);
  }

  // ── request 模式（A）──
  var reqBusy = false;
  function resetReq() {
    $('req-result').className = 'result';
    $('req-result').textContent = '';
    $('req-out').className = 'result';
    $('req-fill').value = '';
    $('req-retrieve').value = '';
    $('req-fill-copy').textContent = t('copy');
    $('req-retrieve-copy').textContent = t('copy');
  }
  $('req-annual').addEventListener('input', function () {
    var has = $('req-annual').value.trim().length > 0;
    $('req-ttl-14d').hidden = !has;
  });
  $('req-go').addEventListener('click', async function () {
    if (reqBusy) return;
    resetReq();
    reqBusy = true;
    $('req-go').disabled = true;
    $('req-go').textContent = t('creating');
    try {
      // 頁內生成 A P-256 金鑰對（私鑰只在記憶體；取件連結 fragment 帶 JWK 含 d）。
      // C-1 (r2)：extractable 必 true：非 extractable 私鑰 exportKey('jwk', privateKey) 即 InvalidAccessError（WebCrypto spec）；
      // 威脅模型不變（JWK 全形本就走連結 fragment；fill 端 ephemeral 金鑰對保持 extractable=false、不出機）。
      var keypair = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveKey']);
      var privJwk = await crypto.subtle.exportKey('jwk', keypair.privateKey);
      var pubJwk = await crypto.subtle.exportKey('jwk', keypair.publicKey);
      var body = { a_pub_jwk: pubJwk, ttl_ms: Number($('req-ttl').value) };
      var annual = $('req-annual').value.trim();
      if (annual) body.annual_token = annual;
      var res;
      try {
        res = await fetch('/api/sreq', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
      } catch (e) {
        // MINOR-1 (r2)：僅 fetch 拒絕算網路錯誤。
        showErr('req-result', 'neterror');
        return;
      }
      if (res.status === 429) { showErr('req-result', 'ratelimited'); return; }
      if (res.status === 400) { showErr('req-result', 'badrequest'); return; }
      if (!res.ok) { showErr('req-result', 'neterror'); return; }
      var data;
      try { data = await res.json(); } catch (e) { showErr('req-result', 'badrequest'); return; }
      // 正典路徑（server 不出 fragment）；頁內接 #p=（公鑰）／#k=（私鑰）。私鑰只存本頁記憶體。
      var fillLink = location.origin + data.fill_url + '#p=' + bytesToB64url(new TextEncoder().encode(JSON.stringify(pubJwk)));
      var retrieveLink = location.origin + data.retrieve_url + '#k=' + bytesToB64url(new TextEncoder().encode(JSON.stringify(privJwk)));
      $('req-fill').value = fillLink;
      $('req-retrieve').value = retrieveLink;
      $('req-out').className = 'result ok';
      // 明文（A 金鑰）成功上鎖後清空年費輸入，避免同一權杖被重按產生第二則。
      $('req-annual').value = '';
      $('req-ttl-14d').hidden = true;
    } catch (e) {
      // MINOR-1 (r2)：非 fetch 錯誤（crypto.subtle 不可用／金鑰生成／匯出失敗）誠實訊息，不誤歸因網路。
      showErr('req-result', 'cryptoerror');
    } finally {
      reqBusy = false;
      $('req-go').textContent = t('create');
      $('req-go').disabled = false;
    }
  });
  $('req-fill').addEventListener('click', function () { $('req-fill').select(); });
  $('req-retrieve').addEventListener('click', function () { $('req-retrieve').select(); });
  $('req-fill-copy').addEventListener('click', function () { copyText($('req-fill').value, $('req-fill-copy')); });
  $('req-retrieve-copy').addEventListener('click', function () { copyText($('req-retrieve').value, $('req-retrieve-copy')); });

  // ── fill 模式（B）──
  var fillBusy = false, fillDone = false;
  $('fill-input').addEventListener('input', function () {
    if (!fillDone) $('fill-go').disabled = !$('fill-input').value.length;
  });
  $('fill-go').addEventListener('click', async function () {
    if (fillBusy || fillDone) return;
    var text = $('fill-input').value;
    if (!text.length) return;
    fillBusy = true;
    $('fill-go').disabled = true;
    $('fill-go').textContent = t('sending');
    try {
      // 揭示前零請求：按送出才 importKey(A.pub) → 封裝 → POST。
      var aPubKey = await importEcdhPub(aPubJwk);
      var blob = await sealToApub(aPubKey, text, slotId);
      var res;
      try {
        res = await fetch('/api/sreq/fill?s=' + slotId, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ciphertext: blob })
        });
      } catch (e) {
        // MINOR-1 (r2)：僅 fetch 拒絕算網路錯誤。
        showErr('fill-result', 'neterror');
        return;
      }
      if (res.status === 404) { showErr('fill-result', 'g1'); fillDone = true; return; }
      if (res.status === 429) { showErr('fill-result', 'ratelimited'); return; }
      if (!res.ok) { showErr('fill-result', 'badrequest'); return; }
      var data;
      try { data = await res.json(); } catch (e) { showErr('fill-result', 'fillinterrupted'); fillDone = true; return; }
      // 成功：H1＋G3（確認碼）。清空＋丟棄臨時私鑰（sealToApub 內作用域即棄）。
      fillConfCode = typeof data.conf_code === 'string' ? data.conf_code : '';
      $('fill-result').className = 'result ok';
      $('fill-result').textContent = t('h1');
      $('fill-out').className = 'result ok';
      if (fillConfCode) {
        $('fill-conf').textContent = t('g3').replace('{conf_code}', fillConfCode);
      }
      $('fill-input').value = '';
      fillDone = true;
    } catch (e) {
      // MINOR-1 (r2)：非 fetch 錯誤（封裝／importKey 失敗）誠實訊息。
      showErr('fill-result', 'cryptoerror');
    } finally {
      fillBusy = false;
      $('fill-go').textContent = t('send');
      $('fill-go').disabled = fillDone;
    }
  });

  // ── retrieve 模式（A）──
  var revealed = false, terminal = false, retBusy = false;
  var EYE_OPEN = '<path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>';
  var EYE_CLOSED = '<path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><line x1="4" y1="20" x2="20" y2="4"/>';
  function setRetEyeIcon(show) {
    var ic = $('retrieve-eye-icon');
    if (ic) ic.innerHTML = show ? EYE_OPEN : EYE_CLOSED;
    var b = $('retrieve-eye');
    b.setAttribute('aria-pressed', String(show));
    b.setAttribute('aria-label', show ? t('hideText') : t('showText'));
  }
  function retReveal(text) {
    var el = $('retrieve-result');
    el.className = 'result ok';
    el.textContent = '';
    var span = document.createElement('span');
    span.id = 'retrieve-plain';
    span.className = 'plain';
    span.textContent = text;
    el.appendChild(span);
    plainShown = true;
    $('retrieve-eye').style.display = '';
    $('retrieve-copy').style.display = '';
    setRetEyeIcon(true);
  }
  $('retrieve-eye').addEventListener('click', function () {
    plainShown = !plainShown;
    $('retrieve-result').classList.toggle('masked', !plainShown);
    var p = $('retrieve-plain');
    if (p) p.setAttribute('aria-hidden', String(!plainShown));
    setRetEyeIcon(plainShown);
  });
  $('retrieve-copy').addEventListener('click', function () {
    var p = $('retrieve-plain');
    if (p) copyText(p.textContent, $('retrieve-copy'));
  });
  $('retrieve-go').addEventListener('click', async function () {
    if (revealed || terminal || retBusy) return;
    retBusy = true;
    $('retrieve-go').disabled = true;
    $('retrieve-go').textContent = t('reading');
    var burned = false;
    try {
      var res;
      try {
        res = await fetch('/api/sreq/' + slotId + '?t=' + encodeURIComponent(token), { method: 'GET', cache: 'no-store' });
      } catch (e) {
        // MINOR-1 (r2)：僅 fetch 拒絕算網路錯誤（此刻 burned 仍 false）。
        showErr('retrieve-result', 'neterror');
        return;
      }
      if (res.status === 404) { showErr('retrieve-result', 'e2'); terminal = true; return; }
      if (res.status === 410) { showErr('retrieve-result', 'e1'); terminal = true; return; }
      if (res.status === 429) { showErr('retrieve-result', 'ratelimited'); return; }
      if (!res.ok) { showErr('retrieve-result', 'neterror'); return; }
      burned = true;
      var data;
      try { data = await res.json(); } catch (e) { if (burned) throw e; data = null; }
      if (!data || data.ciphertext === null || data.ciphertext === undefined) {
        // 尚未填寫：不焚燒，可稍後重按。
        showErr('retrieve-result', 'h2');
        return;
      }
      var cipher = String(data.ciphertext);
      if (cipher.slice(0, CIPHER.length) !== CIPHER) {
        showErr('retrieve-result', 'g2');
        $('retrieve-result').textContent += ' ' + t('g2burn');
        terminal = true;
        return;
      }
      var plain = await openBlobWithApriv(aPrivKey, cipher, slotId);
      if (plain === null) {
        // 已焚燒後才解不開（fragment 被截斷/改過/slot 污染）＝G2 兩句全顯。
        showErr('retrieve-result', 'g2');
        $('retrieve-result').textContent += ' ' + t('g2burn');
        terminal = true;
        return;
      }
      retReveal(plain);
      retWrittenAt = typeof data.written_at === 'number' ? data.written_at : 0;
      retConfCode = typeof data.conf_code === 'string' ? data.conf_code : '';
      if (retWrittenAt || retConfCode) {
        $('retrieve-meta').style.display = '';
        if (retWrittenAt) $('retrieve-time').textContent = t('g0').replace('{MM/DD HH:mm}', fmtTime(retWrittenAt));
        if (retConfCode) $('retrieve-conf').textContent = t('g3').replace('{conf_code}', retConfCode);
      }
      revealed = true;
    } catch (e) {
      // MINOR-1 (r2)：非 fetch 錯誤（頁內加密／context 型）；burned=true（已 200）保守面維持 g2。
      showErr('retrieve-result', burned ? 'g2' : 'cryptoerror');
      if (burned) { $('retrieve-result').textContent += ' ' + t('g2burn'); terminal = true; }
    } finally {
      retBusy = false;
      $('retrieve-go').textContent = t('collect');
      $('retrieve-go').disabled = revealed || terminal;
      if (revealed) $('retrieve-go').style.display = 'none';
    }
  });

  // ── 初始化：顯示對應模式 ──
  if (MODE === 'request') {
    $('req-sec').style.display = 'block';
  } else if (MODE === 'fill') {
    $('fill-sec').style.display = 'block';
    // 前驗 #p=（A.pub JWK）：bad/缺＝G2、零請求。
    if (!slotId || !/^[0-9a-f]{32}$/.test(slotId)) {
      $('fill-missing').textContent = t('g2');
      $('fill-missing').style.display = 'block';
    } else {
      try {
        // C-2 (r2)：decode＝encode 的逆（encode＝b64url(utf8(JSON))）；percent 解碼對 b64url 恆 identity（全 unreserved）＝死巷根因。
        aPubJwk = JSON.parse(new TextDecoder().decode(b64urlToBytes(fragVal)));
        if (!aPubJwk || aPubJwk.kty !== 'EC' || aPubJwk.crv !== 'P-256' || typeof aPubJwk.x !== 'string' || typeof aPubJwk.y !== 'string') throw new Error('badjwk');
      } catch (e) {
        $('fill-missing').textContent = t('g2');
        $('fill-missing').style.display = 'block';
      }
      if (!$('fill-missing').style.display) $('fill-tool').style.display = 'block';
    }
  } else if (MODE === 'retrieve') {
    $('retrieve-sec').style.display = 'block';
    // 前驗 #k=（A 私鑰 JWK）：b64url 可解→JSON 可解→importKey(['deriveKey']) 三關過才放行取件；否則 G2、零請求。
    if (!slotId || !/^[0-9a-f]{32}$/.test(slotId) || !token) {
      $('retrieve-missing').textContent = t('g2');
      $('retrieve-missing').style.display = 'block';
    } else {
      (async function () {
        try {
          // C-2 (r2)：同上（decode＝encode 的逆）。
          var privJwk = JSON.parse(new TextDecoder().decode(b64urlToBytes(fragVal)));
          if (!privJwk || privJwk.kty !== 'EC' || privJwk.crv !== 'P-256' || typeof privJwk.d !== 'string') throw new Error('badjwk');
          aPrivKey = await importEcdhPriv(privJwk);
          $('retrieve-tool').style.display = 'block';
        } catch (e) {
          $('retrieve-missing').textContent = t('g2');
          $('retrieve-missing').style.display = 'block';
        }
      })();
    }
  }

  retEye = $('retrieve-eye');
  applyLang();
})();
</script>
<script>
/* 明暗三態 menu（2026-09-15，kanban t_44a227eb）：對位 app theme.ts 母型。
   缺省＝跟隨系統：移除屬性＋清儲存；label 與三態文案從 DOM data-label-* 讀
   （腳本跨頁逐字共用＝單一 hash）。選後不收合＝即時預覽（app 母型同款）。
   theme-color 同步：亮暗兩行 meta 是媒體查詢態，手動態以單 meta（無 media）
   即時覆寫（app index.html syncThemeColorMeta 同構母型），初始態也同步一次。 */
(function () {
  var KEY = 'tacet_theme';
  var nav = document.querySelector('.theme-switch');
  if (!nav) return;
  var btn = nav.querySelector('.ts-btn');
  var menu = nav.querySelector('.ts-menu');
  var label = nav.querySelector('.ts-label');
  function systemDark() {
    try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { return false; }
  }
  function syncThemeColorMeta(dark) {
    var meta = document.querySelector('meta[name="theme-color"]:not([media])');
    if (!meta) {
      meta = document.createElement('meta');
      meta.name = 'theme-color';
      var first = document.querySelector('meta[name="theme-color"]');
      if (first && first.parentNode) first.parentNode.insertBefore(meta, first);
      else document.head.appendChild(meta);
    }
    meta.setAttribute('content', dark ? '#1b2030' : '#e9e1cd');
  }
  function apply(theme) {
    if (theme === 'light' || theme === 'dark') {
      document.documentElement.setAttribute('data-theme', theme);
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
    syncThemeColorMeta(theme === 'dark' || (theme !== 'light' && systemDark()));
  }
  function store(theme) {
    try {
      if (theme === 'system') localStorage.removeItem(KEY);
      else localStorage.setItem(KEY, theme);
    } catch (e) {}
  }
  function labelName(t) {
    var m = { system: nav.getAttribute('data-label-system'), light: nav.getAttribute('data-label-light'), dark: nav.getAttribute('data-label-dark') };
    return m[t] || '';
  }
  function mark() {
    var t = null;
    try { t = localStorage.getItem(KEY); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = 'system';
    label.textContent = labelName(t);
    menu.querySelectorAll('button').forEach(function (b) {
      var isCur = b.getAttribute('data-theme-choice') === t;
      b.setAttribute('aria-current', String(isCur));
      if (isCur) { b.setAttribute('aria-disabled', 'true'); b.tabIndex = -1; }
      else { b.removeAttribute('aria-disabled'); b.tabIndex = 0; }
    });
    apply(t);
  }
  function setOpen(open) {
    nav.classList.toggle('open', open);
    menu.hidden = !open;
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    setOpen(menu.hidden);
  });
  document.addEventListener('click', function (e) {
    if (!nav.contains(e.target)) setOpen(false);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !menu.hidden) { setOpen(false); btn.focus(); }
  });
  menu.querySelectorAll('button').forEach(function (b) {
    b.addEventListener('click', function () {
      var v = b.getAttribute('data-theme-choice');
      store(v);
      mark();
    });
  });
  mark();
})();
</script>
</body>
</html>
